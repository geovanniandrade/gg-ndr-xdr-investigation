{id:2,title:"Repeated Authentication Failures",level:"Iniciante",sev:"Média",cat:"Identidade",src:"10.10.30.21",dst:"10.10.10.12",signal:"19 falhas de login em quatro minutos, seguidas de sucesso.",logs:["09:11:20 AD 4625 Conta svc-backup, logon negado","09:12:08 AD 4625 Conta svc-backup, logon negado","09:14:40 AD 4624 Conta svc-backup, login bem-sucedido","09:05:00 Change: rotação da senha svc-backup"],clues:["Máquina de origem consta no inventário de backup.","Agente do serviço ainda utilizava senha antiga.","Equipe de backup confirmou correção da credencial."],q:"Qual é a melhor conclusão?",opts:["Força bruta confirmada.","Possível falha operacional; confirmar rotação e origem.","Não investigar porque houve sucesso."],correct:1,why:"Falhas seguidas de sucesso podem ser ataque ou automação com credencial desatualizada. A correlação com mudança e logs é indispensável.",verdict:"Benigno após confirmação operacional.",play:"Falhas de autenticação."},
{id:3,title:"Suspicious DNS Queries",level:"Iniciante",sev:"Baixa",cat:"DNS",src:"10.10.40.31",dst:"192.0.2.53",signal:"14 consultas NXDOMAIN para sync-patch.example em uma hora.",logs:["10:02:15 DNS NXDOMAIN sync-patch.example","10:06:10 DNS NXDOMAIN sync-patch.example","10:11:01 DNS NXDOMAIN sync-patch.example","10:25:44 EDR update-agent.exe consulta sync-patch.example"],clues:["Aplicação de homologação documentada consulta domínio fictício.","Processo está assinado pelo fornecedor de testes.","Não há comunicação externa bem-sucedida."],q:"NXDOMAIN repetido é prova de DGA malicioso?",opts:["Sim, sempre.","Não; é necessário analisar domínio, processo e padrão.","Sim, se houver mais de dez consultas."],correct:1,why:"NXDOMAIN pode ocorrer com erro de configuração, homologação e DGA. Análise de processo e contexto reduz falsos positivos.",verdict:"Provável falso positivo, validar documentação.",play:"Detecções DNS suspeitas."},
{id:4,title:"Possible C2 Beaconing",level:"Intermediário",sev:"Alta",cat:"C2",src:"10.10.50.18",dst:"203.0.113.77",signal:"Conexões HTTPS a cada 60 ± 2 segundos por 45 minutos.",logs:["11:00:00 PROXY CONNECT cdn-update.example:443","11:01:01 PROXY CONNECT cdn-update.example:443","11:02:01 PROXY CONNECT cdn-update.example:443","10:59:58 EDR powershell.exe iniciado por macro de documento"],clues:["Domínio não homologado.","Processo de origem suspeito; hash ainda não validado.","Periodicidade de tráfego por si só não comprova C2."],q:"Qual ação é mais defensável?",opts:["Confirmar C2 apenas pela periodicidade.","Correlacionar árvore de processos, domínio e evidências; escalar.","Apagar arquivos imediatamente."],correct:1,why:"Padrão periódico e execução suspeita elevam o risco, mas a confirmação requer corroboração. Ações devem seguir playbook autorizado.",verdict:"Suspeito de C2; escalar com prioridade.",play:"Beaconing e comunicação suspeita."},

["01 · NDR e XDR","NDR observa comportamento de rede: origens, destinos, protocolos, DNS, conexões e fluxos. XDR correlaciona dados de diferentes fontes como endpoint, identidade, email, nuvem e rede (dependendo da solução). Nenhuma ferramenta detecta tudo sem cobertura e integrações adequadas."],

["04 · Investigação XDR","Correlacione árvore de processos, identidade associada, alertas do EDR, autenticações, eventos de AD e ações no endpoint. Analise quando cada fonte coletou o evento e quais dados estão ausentes."],

["06 · Documentação","Registre timeline, fontes, evidências favoráveis e contrárias, lacunas, decisões, impactos e responsáveis. Não publique capturas, hashes internos, dados pessoais ou logs corporativos reais."],
];

function studies(){return header("📚 Estudos","Aprenda os conceitos usados nas investigações. Conteúdo prático para quem está começando em Blue Team.")+STUDY.map((x,i)=>'<details '+(i===0?"open":"")+'><summary>'+esc(x[0])+'</summary><p class="muted">'+esc(x[1])+'</p></details>').join("")+'<div class="section row"><button class="btn primary" onclick="go(\'investigacoes\')">Ir para investigações →</button><a href="https://attack.mitre.org/" target="_blank" rel="noopener">MITRE ATT&CK ↗</a></div>'}
function investigations(){if(activeCase){let c=CASES.find(c=>c.id===activeCase);let val=answered[c.id];return '<button class="btn noprint" onclick="go(\'investigacoes\')">← Voltar aos alertas</button><div class="section">'+header("SIM-"+String(c.id).padStart(3,"0")+" · "+esc(c.title),"Caso "+esc(c.level)+" • Detecção fictícia • "+esc(c.cat))+'</div>'+
'<div class="row">'+tag(c.sev)+'<span class="pill">NDR/XDR</span>'+(completed[c.id]?'<span class="tag low">Concluído</span>':'')+'</div><div class="section two"><div class="card"><div class="kicker">Alerta</div><p>'+esc(c.signal)+'</p><div class="hint">IP origem: '+esc(c.src)+'</div><div class="hint">IP destino: '+esc(c.dst)+'</div></div><div class="card"><div class="kicker">Objetivo</div><p>Investigar a detecção, interpretar evidências, selecionar a decisão mais defensável e justificar o resultado.</p><div class="hint">Os IPs públicos usam faixas reservadas para documentação.</div></div></div>'+
'<div class="section card"><h2>📑 Registros disponíveis</h2><div class="box evidence">'+c.logs.map(esc).join("\n")+'</div><h3 class="section">Contexto adicional</h3><ul>'+c.clues.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></div>'+
'<div class="section card"><h2>🧠 Decisão do analista</h2><p>'+esc(c.q)+'</p>'+c.opts.map((x,i)=>'<label class="answer"><input type="radio" name="ans" value="'+i+'" '+(val===i?"checked":"")+'> '+esc(x)+'</label>').join("")+'<label for="justification" class="section">Justifique sua análise (opcional)</label><textarea id="justification" class="field" rows="3" placeholder="Quais evidências sustentam sua decisão?"></textarea><div class="row"><button class="btn primary" id="checkCase">Verificar resposta</button><button class="btn" onclick="openReport('+c.id+')">Abrir relatório</button></div><div id="caseFeedback"></div></div>'+
'<div class="section notice">Dica: confirme o que os registros mostram e o que é apenas hipótese. Não execute bloqueios ou isolamento sem autorização.</div>'}
return header("🔎 Investigações","Escolha um alerta, leia os registros simulados e decida como um analista de segurança.")+'<div class="casegrid">'+CASES.map(c=>'<div class="card casecard"><div class="row between"><span class="kicker">SIM-'+String(c.id).padStart(3,"0")+' · '+esc(c.level)+'</span>'+tag(c.sev)+'</div><h3>'+esc(c.title)+'</h3><p>'+esc(c.signal)+'</p><div class="row">'+(completed[c.id]?'<span class="tag low">✓ Concluído</span>':'<span class="muted">Pendente</span>')+'</div><button class="btn primary" onclick="go(\'investigacoes\','+c.id+')">Investigar →</button></div>').join("")+'</div>'}
function playbooks(){const topics=[["Varreduras de rede","Verifique SYN, portas, taxa, conexão efetiva, escopo do scanner e mudanças autorizadas."],["Falhas de autenticação","Correlacione usuário, IP, eventos 4625/4624, rotação de senha, MFA e logons inesperados."],["Consultas DNS","Analise NXDOMAIN, frequência, domínio, processo, histórico e resolver utilizado."],["Beaconing / C2","Investigue periodicidade, processo, domínio, conexão efetiva e sinais de execução suspeita."],["Tráfego de saída / exfiltração","Compare baseline, destino, conteúdo/alertas DLP, serviço homologado e transferência aprovada."],["Movimentação lateral","Correlacione SMB/RDP, logons Windows, identidade, privilégios e ferramentas administrativas."],["Ransomware","Examine alterações massivas, árvore de processos, SMB, backups e escopo do impacto."],["Grupos privilegiados","Confira evento de auditoria, grupo, ator, conta adicionada, ticket e atividades posteriores."]];return header("☷ Playbooks de análise","Guias objetivos para reunir evidências, classificar e encaminhar os alertas.")+'<div class="notice">Fluxo padrão: identificar → validar contexto → correlacionar → classificar → escalar/agir conforme autorização → documentar.</div><div class="section">'+topics.map((x,i)=>'<details '+(i===0?'open':'')+'><summary>'+esc(x[0])+'</summary><p class="muted">'+esc(x[1])+'</p><p><b>Fontes:</b> NDR, firewall, DNS/proxy, EDR, identidade, inventário e registros de mudança conforme aplicável.</p><p><b>Saída:</b> hipótese, evidências a favor/contra, lacunas e decisão fundamentada.</p></details>').join("")+'</div>'}
function quiz(){return header("📝 Prova de conhecimento","10 questões • 1 ponto por acerto • Feedback comentado no resultado.")+(!quizSubmitted?'<div class="notice">Responda às dez perguntas e clique em corrigir. Todas as questões devem ser respondidas.</div>':'')+QUIZ.map((q,i)=>'<div class="section card"><div class="row between"><h3>Questão '+(i+1)+'</h3>'+(quizSubmitted?tag(quizAnswers[i]===q[2]?"Correta":"Incorreta"):'')+'</div><p>'+esc(q[0])+'</p>'+q[1].map((ans,j)=>'<label class="answer"><input type="radio" name="quiz'+i+'" value="'+j+'" '+(quizAnswers[i]===j?"checked":"")+' '+(quizSubmitted?"disabled":"")+'>'+esc(ans)+'</label>').join("")+(quizSubmitted?'<p class="hint"><b>Resposta:</b> '+esc(q[1][q[2]])+'. '+esc(q[3])+'</p>':'')+'</div>').join("")+'<div class="section card">'+(quizSubmitted?'<span class="score">'+QUIZ.filter((q,i)=>quizAnswers[i]===q[2]).length+'/10</span><p class="muted">Sua nota final. Revise os comentários acima.</p><button class="btn primary" id="restartQuiz">Refazer prova</button>':'<button class="btn primary" id="submitQuiz">Corrigir prova</button><p id="quizError" class="hint"></p>')+'</div>'}
function reportView(){return header("▣ Relatório de investigação","Preencha seu registro de investigação. A exportação em PDF utiliza a opção de impressão do navegador.")+'<div class="notice noprint">Os dados ficam apenas nesta página do navegador. Nada é enviado ao GitHub. Use somente informações simuladas.</div><div class="section card"><div class="printonly"><h2>GG Security — Relatório de investigação</h2></div><label for="r-case">Caso</label><select id="r-case" class="field"><option value="">Selecione um caso</option>'+CASES.map(c=>'<option value="'+c.id+'" '+(String(c.id)===String(report.caseId)?"selected":"")+'>'+esc(c.title)+'</option>').join("")+'</select><div class="two"><div><label for="r-analyst">Analista</label><input id="r-analyst" class="field" value="'+esc(report.analyst)+'" placeholder="Nome do analista"></div><div><label for="r-date">Data e hora / fuso</label><input id="r-date" class="field" value="'+esc(report.date)+'" placeholder="AAAA-MM-DD HH:mm -03:00"></div></div><label for="r-hypothesis">Hipótese inicial</label><textarea id="r-hypothesis" rows="3" class="field" placeholder="O que pode explicar o evento?">'+esc(report.hypothesis)+'</textarea><label for="r-evidence">Evidências e linha do tempo</label><textarea id="r-evidence" rows="5" class="field" placeholder="Horário, fonte, evento, evidências e lacunas">'+esc(report.evidence)+'</textarea><label for="r-classification">Classificação</label><select id="r-classification" class="field">'+["Benigno / falso positivo","Suspeito / inconclusivo","Incidente confirmado"].map(x=>'<option '+(report.classification===x?"selected":"")+'>'+x+'</option>').join("")+'</select><label for="r-conclusion">Justificativa / conclusão</label><textarea id="r-conclusion" rows="3" class="field" placeholder="Por que essa classificação?">'+esc(report.conclusion)+'</textarea><label for="r-actions">Ações autorizadas e próximos passos</label><textarea id="r-actions" rows="3" class="field" placeholder="Escalonamento, contenção se autorizada, follow-up">'+esc(report.actions)+'</textarea><div class="row noprint"><button id="printReport" class="btn primary">Imprimir / Salvar PDF</button><button id="copyReport" class="btn">Copiar texto</button><span id="copyInfo" class="hint"></span></div></div>'}
function openReport(id){report.caseId=id;go("relatorio")}
function collectReport(){for(let k of Object.keys(report)){const field=document.getElementById("r-"+(k==="caseId"?"case":k));if(field)report[k]=field.value}}
function reportText(){const c=CASES.find(x=>String(x.id)===String(report.caseId));return "GG SECURITY - RELATÓRIO NDR/XDR\nCaso: "+(c?.title||"Não informado")+"\nAnalista: "+report.analyst+"\nData: "+report.date+"\nHipótese: "+report.hypothesis+"\nEvidências: "+report.evidence+"\nClassificação: "+report.classification+"\nJustificativa: "+report.conclusion+"\nAções e próximos passos: "+report.actions}
function render(){let html=page==="dashboard"?dashboard():page==="estudos"?studies():page==="investigacoes"?investigations():page==="playbooks"?playbooks():page==="prova"?quiz():reportView();el.innerHTML=html;
if(page==="investigacoes"&&activeCase){const c=CASES.find(x=>x.id===activeCase);document.getElementById("checkCase").addEventListener("click",()=>{let selected=document.querySelector('input[name="ans"]:checked');let feedback=document.getElementById("caseFeedback");if(!selected){feedback.innerHTML='<p class="hint">Escolha uma resposta antes de verificar.</p>';return}answered[c.id]=Number(selected.value);let correct=answered[c.id]===c.correct;if(correct){completed[c.id]=true;try{localStorage.setItem("gg_ndr_completed",JSON.stringify(completed))}catch(_){}}feedback.innerHTML='<div class="box section"><b style="color:'+(correct?"var(--green)":"var(--yellow)")+'">'+(correct?"✓ Decisão adequada":"⚠ Reavalie sua hipótese")+'</b><p>'+esc(c.why)+'</p><p><b>Classificação sugerida:</b> '+esc(c.verdict)+'</p><p><b>Resposta esperada:</b> '+esc(c.opts[c.correct])+'</p></div>'})}
if(page==="prova"){if(!quizSubmitted){document.querySelectorAll('input[type="radio"]').forEach(x=>x.addEventListener("change",()=>{const i=Number(x.name.replace("quiz",""));quizAnswers[i]=Number(x.value)}));document.getElementById("submitQuiz").addEventListener("click",()=>{if(Object.keys(quizAnswers).length<10){document.getElementById("quizError").textContent="Responda às 10 questões antes de corrigir.";return}quizSubmitted=true;render();window.scrollTo({top:0,behavior:"smooth"})})}else document.getElementById("restartQuiz").addEventListener("click",()=>{quizSubmitted=false;quizAnswers={};render()})}
if(page==="relatorio"){document.getElementById("printReport").addEventListener("click",()=>{collectReport();window.print()});document.getElementById("copyReport").addEventListener("click",async()=>{collectReport();try{await navigator.clipboard.writeText(reportText());document.getElementById("copyInfo").textContent="Texto copiado."}catch(_){document.getElementById("copyInfo").textContent="Cópia não disponível neste navegador."}});document.querySelectorAll(".field").forEach(x=>x.addEventListener("input",collectReport))}}
render();
</script></body></html>
